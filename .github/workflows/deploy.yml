name: Build & Deploy Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install openpyxl
      - name: Stamp page version
        # เวอร์ชัน = hash ของโค้ดหน้าเว็บ (ไม่ใช่ commit) — เปลี่ยนเฉพาะเมื่อแก้หน้าเว็บ
        # หน้าที่เปิดค้างไว้จะรีโหลดตัวเองเมื่อเวอร์ชันใน data.json ไม่ตรงกับของหน้า
        run: |
          BUILD_ID=$(cat site/index.html site/firebase-config.js site/notes.js | sha256sum | cut -c1-12)
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          sed -i "s/__BUILD_ID__/$BUILD_ID/g" site/index.html
          echo "page version: $BUILD_ID"
      - name: Convert Excel -> data.json
        run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
